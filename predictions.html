<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#9e1b25"><title>539 DATA｜真實預測紀錄</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#252525;background:#f5f3f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-weight:900;color:#9e1b25;text-decoration:none}.back{color:#9e1b25}.intro{margin:30px 0 22px}.intro h1{margin:4px 0;font-size:clamp(26px,5vw,38px)}.muted{color:#777;font-size:13px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:20px 0}.metric,.record{background:#fff;border:1px solid #e8e2dc;border-radius:14px;padding:16px}.metric span{display:block;color:#777;font-size:13px}.metric b{font-size:25px}.record{margin:12px 0}.record-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.balls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.ball{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#9e1b25;color:white;font-weight:800}.ball.alt{background:#eee8e4;color:#6c5149}.hit{color:#137547;font-weight:800}.pending{color:#a66b16;font-weight:700}.details{font-size:13px;color:#666;line-height:1.7}.empty{padding:30px;background:white;border-radius:12px;color:#777}
</style></head><body><main class="wrap"><div class="top"><a class="brand" href="./">539 DATA</a><a class="back" href="./">← 返回數據研究室</a></div>
<section class="intro"><div class="muted">PREDICTION ARCHIVE · NO RETROACTIVE FABRICATION</div><h1>真實預測紀錄</h1><p class="muted">保存開獎前實際產生的推薦，開獎後自動結算。舊期沒有存檔的推薦不會用新模型補造。</p></section>
<div class="summary" id="summary"><div class="metric"><span>讀取中</span><b>—</b></div></div><section id="records"></section>
</main><script>
(async()=>{const root=document.querySelector("#records"),summary=document.querySelector("#summary");try{const r=await fetch("./data/predictions539.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("目前尚未建立預測存檔");const data=await r.json(),items=data.predictions||[],done=items.filter(x=>x.result),avg=done.length?(done.reduce((s,x)=>s+x.result.hitCount,0)/done.length).toFixed(3):"—";summary.innerHTML='<div class="metric"><span>預測總筆數</span><b>'+items.length+'</b></div><div class="metric"><span>已結算期數</span><b>'+done.length+'</b></div><div class="metric"><span>已結算平均命中</span><b>'+avg+'</b></div><div class="metric"><span>模型版本</span><b style="font-size:14px">'+(data.modelVersion||"—")+'</b></div>';if(!items.length){root.innerHTML='<div class="empty">目前還沒有預測紀錄。官方資料更新並成功執行存檔工作後，第一筆預測會出現在這裡。</div>';return}root.innerHTML=items.slice().reverse().map(p=>{const result=p.result,hitSet=new Set(result?.hits||[]);return '<article class="record"><div class="record-head"><b>預測來源期別 '+p.sourcePeriod+'（'+p.sourceDate+'）</b><span class="'+(result?'hit':'pending')+'">'+(result?'命中 '+result.hitCount+' 顆':'等待下一期開獎')+'</span></div><div class="balls">'+p.top5.map(n=>'<span class="ball">'+String(n).padStart(2,"0")+'</span>').join("")+'</div><div class="details">備選：'+p.backup5.map(n=>String(n).padStart(2,"0")).join("、")+'<br>模型：'+p.modelVersion+'｜保存時間：'+new Date(p.createdAt).toLocaleString("zh-TW")+'</div>'+(result?'<hr><div class="record-head"><b>實際開獎 '+result.period+'（'+result.date+'）</b><span class="hit">命中號碼：'+(result.hits.length?result.hits.map(n=>String(n).padStart(2,"0")).join("、"):"無")+'</span></div><div class="balls">'+result.numbers.map(n=>'<span class="ball '+(hitSet.has(n)?"":"alt")+'">'+String(n).padStart(2,"0")+'</span>').join("")+'</div>':'')+'</article>'}).join("")}catch(e){root.innerHTML='<div class="empty">'+e.message+'。請稍後再重新整理。</div>'}})();
</script></body></html>
