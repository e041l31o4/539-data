<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9e1b25"><title>539 DATA｜模型實驗室</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#282522;background:#f5f3f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:26px 18px 60px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;color:#9e1b25;text-decoration:none}.intro{margin:32px 0 22px}.intro h1{font-size:clamp(26px,5vw,38px);margin:5px 0}.muted{color:#777;font-size:13px}.notice{background:#fff;border:1px solid #e8e2dc;border-radius:12px;padding:14px;line-height:1.7;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}.metric,.panel{background:white;border:1px solid #e8e2dc;border-radius:13px;padding:15px}.metric span{display:block;color:#777;font-size:12px}.metric b{font-size:22px}.tablewrap{overflow:auto;background:white;border:1px solid #e8e2dc;border-radius:13px;margin-top:16px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:14px}th{color:#777;font-weight:600;background:#faf9f7}.best{font-weight:800;color:#147447}.segments{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.seg{background:#faf9f7;border-radius:9px;padding:10px;font-size:12px;line-height:1.7}.model{margin-top:15px}.model h3{margin:0 0 8px;font-size:16px}.foot{margin-top:22px;color:#777;font-size:12px;line-height:1.7}@media(max-width:600px){.segments{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><a class="brand" href="./">539 DATA</a><a class="brand" href="./predictions.html">真實預測紀錄 ↗</a></div>
<section class="intro"><div class="muted">ROLLING WALK-FORWARD · MODEL RESEARCH</div><h1>模型實驗室</h1><p class="muted">固定規則、逐期往前測試，不用當期開獎資料預測當期結果。</p></section>
<div id="app"><div class="notice">正在載入回測資料…</div></div>
</main><script>
(async()=>{const root=document.querySelector("#app");try{const r=await fetch("./data/model-backtest539.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("尚未產生回測報告");const d=await r.json(),b=d.randomBaseline,models=Object.entries(d.models).sort((a,b)=>b[1].overall.averageHits-a[1].overall.averageHits);const pct=x=>Number(x).toFixed(2)+"%";root.innerHTML='<div class="metrics"><div class="metric"><span>測試期數</span><b>'+d.testPeriodCount+'</b></div><div class="metric"><span>資料截止</span><b style="font-size:17px">'+d.dataThrough+'</b></div><div class="metric"><span>隨機平均命中</span><b>'+b.averageHits.toFixed(3)+'</b></div><div class="metric"><span>隨機命中至少2顆</span><b>'+pct(100*b.atLeast2)+'</b></div></div><div class="notice"><b>回測範圍：</b>'+d.testFrom+' 至 '+d.testTo+'（'+d.historyCount+' 期歷史資料）。'+d.selectionRule+'<br><b>注意：</b>這是歷史樣本測試，不代表未來機率；比較多種模型也會產生挑選偏差，必須保留後續新資料驗證。</div><div class="tablewrap"><table><thead><tr><th>模型</th><th>平均命中</th><th>至少1顆</th><th>至少2顆</th><th>至少3顆</th><th>與前一期重複碼</th><th>期數</th></tr></thead><tbody>'+models.map(([id,m])=>'<tr><td>'+m.label+'</td><td class="'+(m.overall.averageHits>b.averageHits?'best':'')+'">'+m.overall.averageHits.toFixed(3)+'</td><td>'+pct(m.overall.atLeast1Pct)+'</td><td>'+pct(m.overall.atLeast2Pct)+'</td><td>'+pct(m.overall.atLeast3Pct)+'</td><td>'+(m.overall.averageOverlapPreviousPick??'—')+' 顆</td><td>'+m.overall.periods+'</td></tr>').join("")+'</tbody></table></div><h2 style="margin-top:28px">分段穩定性</h2>'+models.map(([id,m])=>'<section class="model"><h3>'+m.label+'</h3><div class="segments">'+m.segments.map((s,i)=>'<div class="seg"><b>第 '+(i+1)+' 段</b><br>平均命中 '+s.averageHits.toFixed(3)+' 顆<br>至少1顆 '+pct(s.atLeast1Pct)+'<br>至少2顆 '+pct(s.atLeast2Pct)+'<br>至少3顆 '+pct(s.atLeast3Pct)+'</div>').join("")+'</div></section>').join("")+'<p class="foot">隨機基準以每期從39碼中等機率抽取5碼計算。回測每期只讀取該期之前的開獎紀錄。任何策略若只在單一分段突出、其他分段失效，不應直接升級為正式推薦模型。</p>'}catch(e){root.innerHTML='<div class="notice">'+e.message+'。請等 GitHub Actions 完成後重新整理。</div>'}})();
</script></body></html>
