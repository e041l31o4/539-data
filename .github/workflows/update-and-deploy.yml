name: Update 539 history and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 14 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "重新抓取官方 API 可提供的歷史資料"
        type: boolean
        default: false
concurrency:
  group: 539-pages-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Update official draw data
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ ! -f data/daily539.json ]; then
            node scripts/update-lottery.mjs --full
          else
            node scripts/update-lottery.mjs
          fi
      - name: Archive next-draw prediction and settle previous record
        run: node scripts/archive-prediction.mjs
      - name: Commit updated dataset and prediction archive
        run: |
          git config user.name "539-data-bot"
          git config user.email "539-data-bot@users.noreply.github.com"
          git add data/daily539.json data/predictions539.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official 539 results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
