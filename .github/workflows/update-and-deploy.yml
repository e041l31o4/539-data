name: Update 539 history and deploy
on:
  schedule:
    - cron: "45 13 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "重新抓取 2007 年至今全部歷史資料"
        type: boolean
        default: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update official draw data
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ ! -f data/daily539.json ]; then
            node scripts/update-lottery.mjs --full
          else
            node scripts/update-lottery.mjs
          fi
      - name: Commit updated dataset
        run: |
          git config user.name "539-data-bot"
          git config user.email "539-data-bot@users.noreply.github.com"
          git add data/daily539.json
          git diff --cached --quiet || (git commit -m "data: refresh official 539 results" && git push)
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
